# Optional real-app gate: boots the actual Electron app in a sandbox and
# drives the download/automation surface through the WS bridge. Windows runner
# required: the drill launches node_modules electron's Windows binary and uses
# taskkill. Jobs target the repo's self-hosted runner (buffy-runner: Windows,
# GUI-session capable, no xvfb needed) - hosted windows-latest is currently
# unusable for this account (GitHub refuses runner allocation; see run.md).
# Manual trigger only. Two jobs run in parallel: tests (offline gates) and
# boot-verify (the real-app drill, ~5-6 min of auto-retry timer phases).
name: boot-verify (optional)

on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (with Electron binary)
        run: npm ci

      - name: Offline test suites (npm test)
        run: npm test

      - name: Static checks + shim selftest (npm run check)
        run: npm run check

  boot-verify:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Preflight drill port 8766 (buffy-runner shares this machine)
        # Fail near-instantly when a local task-2 sandbox / dev app holds the
        # drill port, instead of after npm ci with a bare "port in use" (the
        # npm run boot-verify abort also names the holder; see its
        # describePortHolder()). 8766 is NOT auto-reassigned: a silent port
        # change could mask a wedged sandbox app.
        run: |
          node -e "const net=require('net'),cp=require('child_process');const s=net.connect({host:'127.0.0.1',port:8766});s.on('connect',()=>{s.destroy();let pid='';try{const o=cp.execSync('netstat -ano',{encoding:'utf8'});for(const l of o.split(/\r?\n/)){if(l.includes('127.0.0.1:8766')&&l.includes('LISTENING')){const m=/\s([0-9]+)\s*$/.exec(l);if(m){pid=m[1];break}}}}catch(e){}console.error('ABORT port 8766 is busy (pid '+(pid||'?')+') - a local sandbox/dev app holds the drill port on buffy-runner. Kill it (taskkill //PID '+(pid||'<pid>')+' //T //F) and re-dispatch.');process.exit(1)});s.on('error',()=>{});"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (with Electron binary)
        run: npm ci

      - name: Install electron binary (postinstall blocked on maintainer machine)
        run: node node_modules/electron/install.js

      - name: Run boot drill
        run: npm run boot-verify

      - name: Upload drill artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-verify-sandbox
          path: scripts/bv-*/
          retention-days: 7
