<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Deep Grab Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, Segoe UI, sans-serif; }
    body { display: flex; flex-direction: column; background: #0f172a; color: #e2e8f0; overflow: hidden; }
    #nav { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #1e293b; border-bottom: 1px solid #334155; flex: 0 0 auto; height: 48px; }
    button { background: #334155; color: #e2e8f0; border: none; border-radius: 5px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
    button:hover { background: #475569; }
    button.on { background: #2563eb; color: #fff; }
    button:disabled { opacity: .4; cursor: default; }
    #url { flex: 1; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 5px; padding: 6px 10px; font-size: 13px; }
    #tabbar { display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: #16233b; overflow-x: auto; flex: 0 0 auto; height: 38px; border-bottom: 1px solid #1e293b; }
    .tab { display: inline-flex; align-items: center; gap: 6px; max-width: 180px; padding: 4px 8px; border-radius: 6px 6px 0 0; background: #1e293b; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; }
    .tab.active { background: #334155; }
    .tab .t { overflow: hidden; text-overflow: ellipsis; }
    .tab.suspended .t { opacity: .55; font-style: italic; }
    .tab .x { padding: 0 2px; opacity: .7; }
    .tab .x:hover { opacity: 1; }
    .tab-new { background: transparent; color: #94a3b8; padding: 2px 8px; font-size: 16px; }
    #content { flex: 1 1 0%; min-height: 0; position: relative; }
    #tabbar { position: relative; }
    #tabsearch { width: 130px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 5px; padding: 4px 8px; font-size: 12px; }
    #tabtools { background: transparent; color: #94a3b8; padding: 2px 8px; font-size: 16px; }
    #tabmenu { display: none; position: absolute; top: 38px; right: 8px; z-index: 20; flex-direction: column; gap: 2px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 4px; min-width: 160px; }
    #tabmenu button { text-align: left; background: #334155; }
    #tabmenu button:hover { background: #475569; }
  </style>
</head>
<body>
  <div id="nav">
    <button id="back" title="Back">&#8592;</button>
    <button id="fwd" title="Forward">&#8594;</button>
    <button id="reload" title="Reload">&#8635;</button>
    <button id="ntmode" title="Links open in a new tab instead of navigating away">&#8674; New tab</button>
    <button id="autoscroll" title="Unlimited scroll: keeps scrolling and clicking Load more until you stop it">&#8595; Auto</button>
    <input id="url" type="text" placeholder="Enter a URL and press Enter">
    <button id="go">Go</button>
    <span id="tabcount" title="Open tabs" style="opacity:.55;font-size:12px;padding:0 2px;"></span>
  </div>
  <div id="tabbar">
    <button class="tab-new" id="newtab" title="New tab">+</button>
    <input id="tabsearch" type="text" placeholder="Filter tabs…">
    <button id="tabtools" title="Tab tools">&#9776;</button>
    <div id="tabmenu">
      <button data-act="autogroup">Auto group by site</button>
      <button data-act="group">Group by site</button>
      <button data-act="dupes">Close duplicates</button>
      <button data-act="others">Close others</button>
      <button data-act="domain">Close same site</button>
      <button data-act="all">Close all</button>
    </div>
  </div>
  <div id="content"></div>
  <script>
    const urlInput = document.getElementById("url");
    const backBtn = document.getElementById("back");
    const fwdBtn = document.getElementById("fwd");
    const reloadBtn = document.getElementById("reload");
    const goBtn = document.getElementById("go");
    const tabbar = document.getElementById("tabbar");
    const content = document.getElementById("content");
    let activeId = null;

    function reportRect() {
      const r = content.getBoundingClientRect();
      window.api.reportContentRect({ x: r.x, y: r.y, width: r.width, height: r.height });
    }
    window.addEventListener("resize", reportRect);
    new ResizeObserver(reportRect).observe(content);

    let lastList = [], lastActive = null, tabFilter = "";
    function renderTabs(list, active) {
      lastList = list || [];
      lastActive = active;
      applyTabRender();
    }
    function applyTabRender() {
      activeId = lastActive;
      [...tabbar.querySelectorAll(".tab")].forEach((el) => el.remove());
      const f = (tabFilter || "").trim().toLowerCase();
      lastList.forEach((t) => {
        const hay = ((t.title || "") + " " + (t.url || "")).toLowerCase();
        if (f && !hay.includes(f)) return;
        const btn = document.createElement("div");
        btn.className = "tab" + (t.id === lastActive ? " active" : "") + (t.suspended ? " suspended" : "");
        if (t.suspended) btn.title = "Suspended — click to reload";
        btn.innerHTML = '<span class="t">' + (t.title || t.url) + '</span><span class="x" title="Close">&#10005;</span>';
        btn.addEventListener("click", (e) => { if (!e.target.classList.contains("x")) window.api.activate(t.id); });
        btn.querySelector(".x").addEventListener("click", () => window.api.closeTab(t.id));
        tabbar.appendChild(btn);
      });
      const tc = document.getElementById("tabcount");
      if (tc) tc.textContent = String(lastList.length);
    }

    window.api.onTabsUpdate((list, active) => renderTabs(list, active));
    window.api.onNavState((st) => {
      urlInput.value = st.url || "";
      backBtn.disabled = !st.canGoBack;
      fwdBtn.disabled = !st.canGoForward;
      asBtn.classList.toggle("on", !!st.autoscroll);
      if (st.autoInfo) {
        const i = st.autoInfo;
        asBtn.title = `Auto ON — page h=${i.h}, idle ${i.still}/50` + (i.next ? `, next: ${i.next}` : ", no next found");
      } else {
        asBtn.title = "Unlimited scroll: keeps scrolling and turning pages until you stop it";
      }
    });

    function go() {
      const u = urlInput.value.trim();
      if (!u) return;
      window.api.navigate(u);
    }
    goBtn.addEventListener("click", go);
    urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    reloadBtn.addEventListener("click", () => window.api.reload());
    backBtn.addEventListener("click", () => window.api.back());
    fwdBtn.addEventListener("click", () => window.api.forward());
    document.getElementById("newtab").addEventListener("click", () => window.api.newTab());

    const tabSearch = document.getElementById("tabsearch");
    tabSearch.addEventListener("input", () => { tabFilter = tabSearch.value; applyTabRender(); });

    const tabTools = document.getElementById("tabtools");
    const tabMenu = document.getElementById("tabmenu");
    tabTools.addEventListener("click", (e) => {
      e.stopPropagation();
      tabMenu.style.display = tabMenu.style.display === "flex" ? "none" : "flex";
    });
    document.addEventListener("click", (e) => {
      if (!tabMenu.contains(e.target) && e.target !== tabTools) tabMenu.style.display = "none";
    });
    let gmOn = localStorage.getItem("dvGroupMode") !== "0";
    tabMenu.querySelectorAll("button").forEach((b) => {
      b.addEventListener("click", () => {
        const act = b.dataset.act;
        if (act === "autogroup") {
          gmOn = !gmOn;
          localStorage.setItem("dvGroupMode", gmOn ? "1" : "0");
          b.textContent = (gmOn ? "\u2713 " : "") + "Auto group by site";
          window.api.setGroupMode(gmOn);
          return;
        }
        if (act === "group") window.api.groupTabs();
        else if (act === "dupes") window.api.closeDuplicates();
        else if (act === "others") window.api.closeOthers();
        else if (act === "domain") window.api.closeDomain();
        else if (act === "all") {
          if (!confirm("Close all " + lastList.length + " tabs?")) return;
          window.api.closeAll();
        }
        tabMenu.style.display = "none";
      });
    });
    const gmBtn = tabMenu.querySelector('[data-act="autogroup"]');
    gmBtn.textContent = (gmOn ? "\u2713 " : "") + "Auto group by site";
    window.api.setGroupMode(gmOn);
    window.api.onGroupMode((on) => { gmOn = on; gmBtn.textContent = (gmOn ? "\u2713 " : "") + "Auto group by site"; });

    document.addEventListener("keydown", (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      if (e.key === "w" || e.key === "W") {
        e.preventDefault();
        if (activeId) window.api.closeTab(activeId);
      } else if (/^[1-9]$/.test(e.key)) {
        const t = lastList[parseInt(e.key, 10) - 1];
        if (t) { e.preventDefault(); window.api.activate(t.id); }
      }
    });

    const ntBtn = document.getElementById("ntmode");
    let ntOn = localStorage.getItem("dvNewTabMode") !== "0";
    const applyNtMode = () => {
      ntBtn.classList.toggle("on", ntOn);
      window.api.setNewTabMode(ntOn);
    };
    ntBtn.addEventListener("click", () => {
      ntOn = !ntOn;
      localStorage.setItem("dvNewTabMode", ntOn ? "1" : "0");
      applyNtMode();
    });
    applyNtMode();

    const asBtn = document.getElementById("autoscroll");
    asBtn.addEventListener("click", () => window.api.toggleAutoScroll());

    reportRect();
  </script>
</body>
</html>
