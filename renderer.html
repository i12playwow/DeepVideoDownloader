<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Video Downloader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>▶ Deep Video Downloader</h1>
    <div class="hint">WebSocket server: <code>ws://127.0.0.1:8765</code> — links arrive from the browser extension</div>
    <div style="margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
      <button id="openBrowser" class="btn ghost" style="font-size: 11px;">🌐 Open browser</button>
      <select id="browserTarget" title="Open the URL in which browser" style="background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:5px;padding:4px 6px;font-size:12px;">
        <option value="builtin">Built-in</option>
        <option value="chrome">Chrome</option>
        <option value="edge">Edge</option>
        <option value="brave">Brave</option>
        <option value="default">System default</option>
      </select>
      <textarea id="browserUrl" rows="2" placeholder="Type one or more URLs (one per line) and press Ctrl+Enter or Open" style="min-width: 340px; background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:5px;padding:5px 8px;font-size:12px;resize:vertical;font-family:inherit;"></textarea>
      <button id="browserGo" class="btn ghost" style="font-size: 11px;">Open</button>
      <button id="downloadAll" class="btn ghost" style="font-size: 11px;" title="Directly enqueue every URL as a download">&#8681; Download all</button>
      <button id="themeToggle" class="btn ghost" style="font-size: 11px;">🌓 Toggle theme</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>Downloads</h2>
        <div class="panel-actions">
          <button id="openDir" class="btn ghost">Open folder</button>
          <button id="resumeLast" class="btn ghost">↻ Resume last</button>
          <button id="showActive" class="btn ghost active">Active</button>
          <button id="showHistory" class="btn ghost">History</button>
          <button id="clearHistory" class="btn ghost">Clear history</button>
          <button id="exportJson" class="btn ghost">Export JSON</button>
          <button id="exportCsv" class="btn ghost">Export CSV</button>
        </div>
      </div>
      <div class="batch-bar" id="batchBar">
        <button id="batchPause" class="btn ghost" disabled>⏸ Pause selected</button>
        <button id="batchResume" class="btn ghost" disabled>▶ Resume selected</button>
        <button id="batchCancel" class="btn ghost" disabled>✕ Cancel selected</button>
        <button id="batchRemove" class="btn ghost" disabled>🗑 Remove selected</button>
        <span id="batchCount" class="batch-count"></span>
      </div>
      <table id="dls">
        <thead>
          <tr><th class="sel"><input type="checkbox" id="selAll" title="Select all"></th><th>File</th><th>Size</th><th class="wide">Progress</th><th>Speed</th><th>Proxy</th><th>Sched</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="dlsBody">
          <tr id="emptyRow"><td colspan="9">No downloads yet. Find an MP4 in the browser and it will appear here.</td></tr>
        </tbody>
      </table>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Advanced controls</h2>
      </div>
      <div class="grid">
        <label>Download folder
          <input type="text" id="downloadDir">
        </label>
        <label>Parallel downloads
          <input type="number" id="concurrency" min="1" max="10">
        </label>
        <label>Segments per file (multi-connection)
          <input type="number" id="segments" min="1" max="16">
        </label>
        <label>Speed limit (KB/s, 0 = unlimited)
          <input type="number" id="speedLimitKB" min="0">
        </label>
        <label>Retry attempts (network failures)
          <input type="number" id="maxRetries" min="0" max="10" value="3">
        </label>
        <label>URL refresh attempts (expired direct links)
          <input type="number" id="maxRefresh" min="0" max="10" value="2">
        </label>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="autoProxy"> Auto proxy — pick fastest proxy per connection to boost speed</label>
      </div>
      <div class="grid cols-2">
        <label>Proxy list (one per line: http://…, https://…, socks5://…)
          <textarea id="proxies" rows="5" placeholder="http://127.0.0.1:7890&#10;socks5://127.0.0.1:1080"></textarea>
        </label>
        <div>
          <label>Proxy test target URL</label>
          <input type="text" id="testUrl" value="https://www.google.com">
          <div class="row"><button id="testProxies" class="btn">Test proxies</button><button id="save" class="btn">Save settings</button></div>
          <ul id="proxyResults"></ul>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Bandwidth</h2>
        <div class="panel-actions">
          <span id="bwStats" style="font-size: 11px; color: var(--muted);"></span>
        </div>
      </div>
      <canvas id="bwChart" width="900" height="120" style="width: 100%; height: 120px;"></canvas>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
